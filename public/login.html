<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Browser – Sign in</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #e6edf3;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; }
  h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 26px; height: 26px; }
  p { margin: 0 0 20px; color: #8b949e; font-size: 13px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #c9d1d9; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: inherit; font: inherit; }
  input:focus { outline: 2px solid #1f6feb; outline-offset: 1px; }
  button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #err { color: #ff7b72; font-size: 13px; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1><img src="/favicon.svg" alt="">Agent Browser</h1>
  <p>Your private browser on the VPS.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="b">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script src="/login.js"></script>
</body>
</html>
