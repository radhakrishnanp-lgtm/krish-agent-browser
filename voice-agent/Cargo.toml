[package]
name = "voice-agent"
version = "1.0.0"
edition = "2021"
description = "Browser voice agent: VAD -> STT -> LLM -> TTS with live cost tracking"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls-native-roots", "http2"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
sha2 = "0.10"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
